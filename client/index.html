    <meta name="keywords" content="agência de marketing Sorocaba, produtora de vídeo Sorocaba, gestão de redes sociais Sorocaba, filmagem com drone Sorocaba, branding, tráfego pago, criação de sites" />
    <meta name="author" content="WK Media" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0066FF" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="WK Media | Agência de Marketing e Produtora de Vídeo Premium" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Formulário estático "espelho" apenas para o Netlify detectar os campos no build. -->
    <!-- O formulário real (visível) fica em ContactSection.tsx e envia os dados pra cá via fetch. -->
    <form name="contato" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
